    <h1>JavaScript Syncronous Flow</h1>
  <p id="demo"></p>

<script>
function myDisplayer(some) {
  document.getElementById("demo").innerHTML += some + " ";
}

myDisplayer("A");
myDisplayer("B");
myDisplayer("C");
</script>


<!--  Function  Sequence Example-->

<h1>JavaScript Functions</h1>
<h2>Function Sequence</h2>
<p>JavaScript functions are executed in the sequence they are called.</p>

<p id="demo"></p>

<script>
function myDisplayer(some) {
  document.getElementById("demo").innerHTML += some + " ";
}

function myFirst() {
  myDisplayer("Hello");
}

function mySecond() {
  myDisplayer("Goodbye");
}

myFirst();
mySecond();
</script>

 <h1>JavaScript Functions</h1>

<!-- ASYNC JS EXAMPLE -->

<h1>JavaScript Asyncronous Flow</h1>
<p id="demo"></p>

<script>
function myDisplayer(some) {
  document.getElementById("demo").innerHTML += some + " ";
}

myDisplayer("A");

setTimeout(function() {
  myDisplayer("B");
}, 1000);

myDisplayer("C");
</script>
</body>
